<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huck's Voice to Text</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-state="idle">
    <main class="surface" data-tauri-drag-region>
      <!-- The H, one status line with the Learning switch, the dictation's buttons, close. -->
      <header class="bar" data-tauri-drag-region>
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <mask id="knock">
              <rect x="0" y="0" width="64" height="64" fill="white" />
              <g id="arcs" fill="black"></g>
              <g id="words" fill="black"></g>
            </mask>
          </defs>
          <path id="hbody" mask="url(#knock)" fill="currentColor" />
        </svg>

        <div class="status" data-tauri-drag-region>
          <div class="state-row" data-tauri-drag-region>
            <p class="state" id="state-line">Ready</p>
            <!-- Same setting as H › Settings › Learn From My Fixes. -->
            <button id="learning" class="pill" aria-pressed="true" title="Remember the words you fix" hidden>Learning</button>
          </div>
          <p class="target" id="target-line"></p>
        </div>

        <div class="controls" id="controls" hidden>
          <button id="pause" class="ctl quiet-fill">Pause</button>
          <button id="send" class="ctl">Send</button>
        </div>

        <!-- Always there: the box must never be something he cannot get rid of. -->
        <button id="close" class="close" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2L10 10M10 2L2 10" /></svg>
        </button>
      </header>

      <!-- The words as they are heard. Paused, they can be fixed before sending. -->
      <div class="words" id="live" hidden><span id="live-text"></span> <span class="tail" id="live-tail"></span></div>
      <textarea class="words" id="edit" rows="1" spellcheck="true" hidden></textarea>

      <!-- One line, never a dialog. -->
      <p class="note" id="note" hidden></p>

      <!-- A finished dictation the clipboard would not take: its words stay above, to copy. -->
      <section class="permission" id="unsaved-actions" hidden>
        <button id="words-copy" class="primary">Copy</button>
        <button id="words-discard" class="quiet" hidden>Discard</button>
      </section>

      <!-- Check for Updates: only once a verified download is waiting. -->
      <section class="permission" id="update-actions" hidden>
        <button id="update-open" class="primary">Open Update</button>
        <button id="update-later" class="quiet">Not now</button>
      </section>

      <section class="permission" id="permission" hidden>
        <p id="permission-text">Huck needs Accessibility permission to type into other apps.</p>
        <button id="permission-open" class="primary">Open Settings</button>
        <button id="permission-later" class="quiet">Not now</button>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
