[package]
name = "hvtt-desktop"
description = "Huck's Voice to Text - desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "hvtt_desktop"
path = "src/lib.rs"

[[bin]]
name = "hvtt-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
cpal = "0.18.2"
hound = "3.5.1"
hvtt-core = { path = "../core" }
parking_lot = "0.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.6", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"
whisper-rs = { version = "0.16.0", features = ["metal"] }

# Named pasteboards (Huck's own clipboard). Already in the tree through Tauri; these lines only
# switch on the pasteboard parts.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
