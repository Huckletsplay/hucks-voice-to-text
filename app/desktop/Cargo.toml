[package]
name = "hvtt-desktop"
description = "Huck's Voice to Text - desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "hvtt_desktop"
path = "src/lib.rs"

[[bin]]
name = "hvtt-desktop"
path = "src/main.rs"

[features]
# Tauri's production context omits the build machine's config directory and serves the embedded
# UI through its application protocol. Public packages enable this explicitly; ordinary dev runs
# keep Tauri's development context.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18.2"
hound = "3.5.1"
hvtt-core = { path = "../core" }
parking_lot = "0.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.6", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"

# Named pasteboards (Huck's own clipboard). Already in the tree through Tauri; these lines only
# switch on the pasteboard parts.
[target.'cfg(target_os = "macos")'.dependencies]
# The Accessibility and CoreGraphics calls behind delivery on macOS.
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
# Metal is Apple-only; asking for it anywhere else fails the whisper.cpp build.
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0" }

# Windows: UI Automation, the paste keystroke, the clipboard and the floating box's window style.
# The same `windows` crate Tauri already builds on; these lines only switch on the parts used.
[target.'cfg(windows)'.dependencies]
uds_windows = "1.1"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
