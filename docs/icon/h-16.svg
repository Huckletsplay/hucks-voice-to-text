<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Huck's mark at 16 px">
  <!-- SHARED ASSET - identical in every Huck's program, copied from
       hucks-snip-n-clip/docs/icon/. The letter never varies; only the interior
       does, and below 32 px there is no interior.

       Hand-tuned for the 16 px grid. NOT the 64-unit master scaled down.
       Posts 6 px, slot 2 px, crossbar 4 px. The crossbar is proportionally
       thicker than the master (4/14 against 10/52) because 2 px does not
       read at this size - a deliberate deviation, not an error. -->
  <rect x="1" y="1" width="6" height="14" fill="currentColor"/>
  <rect x="9" y="1" width="6" height="14" fill="currentColor"/>
  <rect x="7" y="6" width="2" height="4" fill="currentColor"/>
</svg>
